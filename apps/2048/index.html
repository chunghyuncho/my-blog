<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>2048</h1>
      <div class="scoreboard" aria-live="polite">
        <div class="score-box">SCORE <span id="score">0</span></div>
        <div class="score-box">BEST <span id="best">0</span></div>
      </div>
      <button id="new-game-btn">새 게임</button>
    </header>
    <p class="instructions">방향키 또는 스와이프로 타일을 움직여 합치세요. 2048을 만들어보세요!</p>
    <div class="board-wrap">
      <div id="board" class="board" role="group" aria-label="2048 게임판">
        <!-- 4x4 배경 그리드 셀 + 타일 레이어(절대 위치)를 동적으로 렌더링 -->
      </div>
      <div id="overlay" class="overlay" hidden aria-live="assertive">
        <p id="overlay-message"></p>
        <div class="overlay-buttons">
          <button id="keep-playing-btn" hidden>계속하기</button>
          <button id="retry-btn">다시 시작</button>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
