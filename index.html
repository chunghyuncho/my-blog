<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>my-blog</title>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container container--wide site-header-inner">
      <a class="site-title" href="index.html">my-blog</a>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="다크 모드 전환" aria-pressed="false"></button>
    </div>
  </header>

  <main class="container container--wide">
    <section class="apps-section">
      <h2 class="section-heading">Mini Apps</h2>
      <ul class="app-list">
        <li class="app-card">
          <div class="app-card-preview">
            <iframe src="apps/2048/index.html" title="2048 게임 미리보기" loading="lazy" tabindex="-1"></iframe>
          </div>
          <h3 class="app-card-title">2048</h3>
          <p class="app-card-description">방향키(또는 스와이프)로 숫자 타일을 밀어서 같은 숫자끼리 합치는 퍼즐 게임. 점수판 포함.</p>
          <a class="app-card-play" href="apps/2048/index.html">전체 화면으로 플레이 →</a>
        </li>
      </ul>
    </section>

    <ul id="post-list" class="post-list">
      <li class="empty-state">불러오는 중...</li>
    </ul>
  </main>

  <footer class="site-footer">
    <div class="container container--wide">
      <p>&copy; 2026 my-blog</p>
    </div>
  </footer>

  <script type="module" src="js/list.js"></script>
</body>
</html>
